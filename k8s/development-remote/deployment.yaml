apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-crzgames-website-backend-deployment
  namespace: dev-crzgames-website-backend
  labels:
    app: dev-crzgames-website-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-crzgames-website-backend
  template:
    metadata:
      labels:
        app: dev-crzgames-website-backend
    spec:
      containers:
        - name: dev-crzgames-website-backend
          image: corentin35/crzgames-website-backend:develop-${TAG_VERSION}
          imagePullPolicy: Always
          ports:
            - containerPort: 3333
          env:
            - name: PORT
              value: '3333'
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      imagePullSecrets:
        - name: regcred
