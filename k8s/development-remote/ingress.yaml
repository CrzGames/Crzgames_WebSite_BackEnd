apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-crzgames-website-backend-ingress
  namespace: dev-crzgames-website-backend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/proxy-body-size: "0" # ou "0" pour illimité
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dev.api.crzgames.com
      secretName: dev-crzgames-website-backend-tls
  rules:
    - host: dev.api.crzgames.com
      http:
        paths:
          - pathType: Prefix
            path: '/'
            backend:
              service:
                name: dev-crzgames-website-backend-service
                port:
                  number: 3333
